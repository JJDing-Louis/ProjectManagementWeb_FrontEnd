name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Audit、Format、Lint、Type Check、Test、Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 設定 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安裝套件
        run: npm ci

      - name: 檢查套件安全弱點
        run: npm audit

      - name: 檢查格式
        run: npm run format:check

      - name: 執行 ESLint
        run: npm run lint

      - name: 執行型別檢查
        run: npm run type-check

      - name: 執行 Vitest
        run: npm run test

      - name: 建立 Production Bundle
        run: npm run build-only
